name: Rebase Upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebase-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebase Upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM: "Vencord/Vesktop"
          UPSTREAM_BRANCH: main
        shell: bash
        run: |
          set -ex

          if [ -z "$UPSTREAM" ]; then
            export GH_TOKEN="$GITHUB_TOKEN"
            UPSTREAM=$(gh api repos/:owner/:repo --jq .parent.full_name)
            [ -n "$UPSTREAM" ] || { echo "Can't find upstream" >&2; exit 1; }
          fi

          echo "$UPSTREAM" | egrep '^(http|git@)' >/dev/null || UPSTREAM="https://github.com/$UPSTREAM.git"

          git remote add upstream "$UPSTREAM"
          git fetch upstream "$UPSTREAM_BRANCH"

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"

          BRANCH="$(git branch --show-current)"

          # Preserve local workflows and exclude them from the upstream rebase.
          WORKFLOW_BACKUP="$(mktemp -d)"
          cp -a .github/workflows/. "$WORKFLOW_BACKUP/"
          
          rm -rf .github/workflows
          
          git rebase "upstream/$UPSTREAM_BRANCH"
          
          # Restore local workflows, completely ignoring upstream workflow changes.
          mkdir -p .github/workflows
          cp -a "$WORKFLOW_BACKUP/." .github/workflows/
          
          rm -rf "$WORKFLOW_BACKUP"
          
          git add .github/workflows
          
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
            ORIGIN_URL=$(git remote get-url origin)
            git remote set-url origin "${ORIGIN_URL/https:\/\/\//https:\/\/x-access-token:$GITHUB_TOKEN@}"
            git push origin "$BRANCH" --force-with-lease
          fi
