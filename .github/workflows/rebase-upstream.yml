name: Rebase Upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebase-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebase Upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM: "Vencord/Vesktop"
          UPSTREAM_BRANCH: main
        shell: bash
        run: |
          set -ex

          if [ -z "$UPSTREAM" ]; then
            export GH_TOKEN="$GITHUB_TOKEN"
            UPSTREAM=$(gh api repos/:owner/:repo --jq .parent.full_name)
            [ -n "$UPSTREAM" ] || { echo "Can't find upstream" >&2; exit 1; }
          fi

          echo "$UPSTREAM" | egrep '^(http|git@)' >/dev/null || \
            UPSTREAM="https://github.com/$UPSTREAM.git"

          git remote add upstream "$UPSTREAM"
          git fetch upstream "$UPSTREAM_BRANCH"

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"

          BRANCH="$(git branch --show-current)"

          # Remember exactly what the fork currently has in .github/workflows.
          #
          # We save the files outside the repository rather than modifying the
          # working tree before the rebase.
          WORKFLOW_BACKUP="$(mktemp -d)"
          if [ -d .github/workflows ]; then
            cp -a .github/workflows/. "$WORKFLOW_BACKUP/"
          fi

          # Rebase everything normally.
          git rebase "upstream/$UPSTREAM_BRANCH"

          # Remove whatever the upstream rebase produced for workflows.
          rm -rf .github/workflows
          mkdir -p .github/workflows

          # Restore the fork's exact workflow contents.
          if [ -d "$WORKFLOW_BACKUP" ]; then
            cp -a "$WORKFLOW_BACKUP/." .github/workflows/
          fi

          rm -rf "$WORKFLOW_BACKUP"

          # Stage the restored workflows.
          git add -A .github/workflows

          # The workflows need to be part of the resulting branch state.
          if ! git diff --cached --quiet; then
            git commit -m "Preserve fork workflows"
          fi

          # Push only when the resulting branch differs from origin.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
            ORIGIN_URL=$(git remote get-url origin)
            git remote set-url origin \
              "${ORIGIN_URL/https:\/\/\//https:\/\/x-access-token:$GITHUB_TOKEN@}"

            git push origin "$BRANCH" --force-with-lease
          fi
